name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'mobile/**'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'

      - name: Configure Android google-services.json
        working-directory: mobile/android/app
        shell: bash
        env:
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f build.gradle ] && [ ! -f build.gradle.kts ]; then
            cd ../..
            flutter create --project-name raahedeen --org com.raahedeen.app .
            cd -
          fi
          if [ -f ../build.gradle ]; then
            sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.9.0'/" ../build.gradle
          fi
          if [ -f ../gradle.properties ]; then
            if ! grep -q "kotlin.version" ../gradle.properties; then
              echo "kotlin.version=1.9.0" >> ../gradle.properties
            else
              sed -i "s/^kotlin.version=.*/kotlin.version=1.9.0/" ../gradle.properties
            fi
          fi
          if [ -f ../settings.gradle ]; then
            sed -i "s/org.jetbrains.kotlin.android' version '[^']*'/org.jetbrains.kotlin.android' version '1.9.0'/" ../settings.gradle
          fi
          if [ -f ../settings.gradle.kts ]; then
            sed -i "s/org.jetbrains.kotlin.android\" version \"[^\"]*\"/org.jetbrains.kotlin.android\" version \"1.9.0\"/" ../settings.gradle.kts
          fi
          echo "$ANDROID_GOOGLE_SERVICES_JSON" > google-services.json

      - name: Flutter Pub Get
        working-directory: mobile
        run: flutter pub get

      - name: Build debug APK
        working-directory: mobile
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: raahedeen-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
