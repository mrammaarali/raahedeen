name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'mobile/**'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'

      - name: Configure Android google-services.json
        working-directory: mobile/android/app
        shell: bash
        env:
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f build.gradle ] && [ ! -f build.gradle.kts ]; then
            cd ../..
            flutter create --project-name raahedeen --org com.raahedeen.app .
            cd -
          fi
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path.cwd().parent
          if root.exists():
            files = [
              root / 'build.gradle',
              root / 'build.gradle.kts',
              root / 'settings.gradle',
              root / 'settings.gradle.kts',
              root / 'gradle.properties',
            ]
            for path in files:
              if not path.exists():
                continue
              text = path.read_text()
              text = re.sub(r"ext\.kotlin_version\s*=\s*['\"][^'\"]+['\"]", "ext.kotlin_version = '1.9.0'", text)
              text = re.sub(r"kotlin\.version\s*=\s*[^\n]+", "kotlin.version=1.9.0", text)
              text = re.sub(r"(id|alias)\s*\(?\s*['\"]org\.jetbrains\.kotlin\.android['\"]\s*\)?\s*version\s*['\"][^'\"]+['\"]",
                            "\\1('org.jetbrains.kotlin.android') version '1.9.0'", text)
              text = re.sub(r'id\("org\.jetbrains\.kotlin\.android"\)\s+version\s+"[^"]+"',
                            'id("org.jetbrains.kotlin.android") version "1.9.0"', text)
              path.write_text(text)
            gp = root / 'gradle.properties'
            if gp.exists() and 'kotlin.version=1.9.0' not in gp.read_text():
              gp.write_text(gp.read_text() + "\nkotlin.version=1.9.0\n")
          PY
          echo "$ANDROID_GOOGLE_SERVICES_JSON" > google-services.json

      - name: Flutter Pub Get
        working-directory: mobile
        run: flutter pub get

      - name: Build debug APK
        working-directory: mobile
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: raahedeen-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
