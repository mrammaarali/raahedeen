name: Deploy Firebase (Functions, Rules)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Functions deps
        working-directory: backend/functions
        run: npm ci

      - name: Create functions .env
        working-directory: backend/functions
        env:
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: |
          echo "OWNER_EMAIL=${OWNER_EMAIL}" > .env

      - name: Firebase Deploy
        uses: w9jds/firebase-action@v13.19.1
        with:
          args: deploy --only functions,firestore:rules,storage
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
