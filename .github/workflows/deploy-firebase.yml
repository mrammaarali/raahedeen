name: Deploy Firebase

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write service account json
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > $HOME/serviceAccount.json

      - name: Deploy Firestore rules + Storage (functions baad me)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: $HOME/serviceAccount.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          firebase use $FIREBASE_PROJECT_ID --project $FIREBASE_PROJECT_ID
          # Abhi sirf rules deploy kar rahe hain, baad me functions add kar sakte hain
          firebase deploy --only firestore,storage --project $FIREBASE_PROJECT_ID
